[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mastodon-telegram-bridge"
description = "A simple bridge between Mastodon and Telegram"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"
license = { text = "MIT" }
authors = [{ name = "cubercsl", email = "hi@cubercsl.site" }]
dependencies = [
    "betterlogging~=1.0.0",
    "Mastodon.py~=2.1.4",
    "markdownify~=1.2.0",
    "Telethon>=1.36,<2",
    "tomli~=2.3.0",
    "websockets>=15,<16",
]

[project.optional-dependencies]
dev = ["autopep8~=2.0"]

[project.urls]
homepage = "https://github.com/cubercsl/mastodon-telegram-bridge"

[project.scripts]
mastodon-telegram-bridge = "mastodon_telegram_bridge.cli:main"

[tool.autopep8]
max_line_length = 127
